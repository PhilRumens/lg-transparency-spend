<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#0b0c0c"/>
  <!-- pediment / roof -->
  <polygon points="6,24 32,8 58,24" fill="#1d70b8"/>
  <!-- building body -->
  <rect x="9" y="24" width="46" height="24" fill="#1d70b8"/>
  <!-- columns -->
  <rect x="13" y="28" width="5" height="18" fill="#0b0c0c"/>
  <rect x="22" y="28" width="5" height="18" fill="#0b0c0c"/>
  <rect x="37" y="28" width="5" height="18" fill="#0b0c0c"/>
  <rect x="46" y="28" width="5" height="18" fill="#0b0c0c"/>
  <!-- base / steps -->
  <rect x="6" y="48" width="52" height="5" fill="#1d70b8"/>
  <!-- pound sign -->
  <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">£</text>
</svg>
